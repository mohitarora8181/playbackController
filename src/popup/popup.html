<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Playback Controller</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <nav id="chips" class="chips" hidden></nav>

  <div id="search-bar" class="search-bar" hidden>
    <svg viewBox="0 0 24 24" class="search-ico"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search" type="text" placeholder="Search songs, artists, playlists…" autocomplete="off" spellcheck="false" />
    <span id="search-spin" class="spin" hidden></span>
    <button id="search-clear" class="search-clear" title="Clear" hidden>×</button>
  </div>

  <section id="results" class="results" hidden>
    <ul id="results-list"></ul>
    <p id="results-msg" class="results-msg"></p>
  </section>

  <main id="player" class="player" hidden>
    <div class="backdrop" id="backdrop"></div>

    <div class="now">
      <div class="art-wrap"><img id="art" alt="" /><div id="art-fallback" class="art-fallback">♪</div></div>
      <div class="meta">
        <div id="title" class="title">—</div>
        <div id="artist" class="artist"></div>
        <button id="site" class="site" title="Go to tab"><span class="dot"></span><span id="site-name"></span> ↗</button>
      </div>
    </div>

    <div class="seek">
      <span id="pos" class="time">0:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek" />
      <span id="dur" class="time">0:00</span>
    </div>

    <div class="controls">
      <button id="shuffle" class="icon small toggle" title="Shuffle">
        <svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
      </button>
      <button id="previous" class="icon" title="Previous (←)">
        <svg viewBox="0 0 24 24" class="fill"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
      </button>
      <button id="toggle" class="icon play" title="Play / pause (space)">
        <svg id="ico-play" viewBox="0 0 24 24" class="fill"><path d="M8 5v14l11-7z"/></svg>
        <svg id="ico-pause" viewBox="0 0 24 24" class="fill" hidden><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
      <button id="next" class="icon" title="Next (→)">
        <svg viewBox="0 0 24 24" class="fill"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
      </button>
      <button id="repeat" class="icon small toggle" title="Repeat">
        <svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></svg>
        <span class="badge">1</span>
      </button>
    </div>

    <div class="bottom">
      <button id="like" class="icon small toggle" title="Like">
        <svg viewBox="0 0 24 24"><path d="M12 21s-7-4.4-9.3-9A5.2 5.2 0 0 1 12 6a5.2 5.2 0 0 1 9.3 6C19 16.6 12 21 12 21z"/></svg>
      </button>
      <div class="volume">
        <button id="mute" class="mute" title="Mute">
          <svg id="ico-vol" viewBox="0 0 24 24" class="vol-ico"><path d="M4 9h4l5-4v14l-5-4H4z" class="fillp"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>
          <svg id="ico-muted" viewBox="0 0 24 24" class="vol-ico" hidden><path d="M4 9h4l5-4v14l-5-4H4z" class="fillp"/><path d="M16 9l6 6M22 9l-6 6"/></svg>
        </button>
        <input id="volume" type="range" min="0" max="100" value="50" aria-label="Volume" />
      </div>
    </div>
  </main>

  <section id="empty" class="empty" hidden>
    <div class="empty-ico">♪</div>
    <p>No music player found.</p>
    <p class="muted">Open one of these sites and start playing:</p>
    <div class="links">
      <a href="https://open.spotify.com" target="_blank">Spotify</a>
      <a href="https://music.youtube.com" target="_blank">YouTube Music</a>
      <a href="https://music.amazon.in" target="_blank">Amazon Music</a>
      <a href="https://gaana.com" target="_blank">Gaana</a>
      <a href="https://www.jiosaavn.com" target="_blank">JioSaavn</a>
    </div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
